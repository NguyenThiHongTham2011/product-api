name: Product API Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Tao cau hinh va volume cho CI
        run: |
          cat > .env.docker <<'EOF'
          PORT=3000
          MONGO_URI=mongodb://nammongodb:27017/productci_prod_test
          EOF

          docker volume create nammongodb_data
          docker compose config --quiet

      - name: Build va khoi dong ung dung
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps

      - name: Kiem tra healthcheck va CRUD
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error

          BASE = "http://127.0.0.1:3000"

          def request(method, path, expected_status, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  method=method,
                  headers={"Content-Type": "application/json"}
              )

              try:
                  response = urllib.request.urlopen(req, timeout=10)
              except urllib.error.HTTPError as error:
                  response = error

              with response:
                  status = response.code
                  raw = response.read().decode()

              assert status == expected_status, (
                  f"{method} {path}: expected {expected_status}, "
                  f"got {status}; body={raw}"
              )
              print(f"PASS: {method} {path} -> {status}")
              return json.loads(raw) if raw else None

          def check_product(actual, expected):
              for key, value in expected.items():
                  assert actual[key] == value, (
                      f"{key}: expected {value}, got {actual.get(key)}"
                  )

          path = "/api/products"
          item_path = path + "/CI-PROD-001"
          product = {
              "pid": "CI-PROD-001",
              "pname": "Notebook",
              "price": 25000,
              "quantity": 10
          }

          # Healthcheck: API và MongoDB đều hoạt động.
          health = request("GET", "/health", 200)
          assert health["status"] == "healthy"
          assert health["database"] == "connected"

          # CREATE.
          created = request("POST", path, 201, product)
          check_product(created, product)
          product_id = created["_id"]

          # Trùng mã phải bị từ chối.
          request("POST", path, 409, product)

          # Dữ liệu không hợp lệ phải bị từ chối.
          invalid = dict(product, pid="INVALID", price=-1)
          request("POST", path, 400, invalid)
          request("GET", path + "/INVALID", 404)

          # READ: danh sách và chi tiết.
          products = request("GET", path, 200)
          assert isinstance(products, list)
          assert any(p["pid"] == product["pid"] for p in products)

          detail = request("GET", item_path, 200)
          check_product(detail, product)
          assert detail["_id"] == product_id

          # UPDATE và đọc lại để xác nhận đã lưu.
          updated_product = dict(product, price=30000, quantity=5)
          updated = request("PUT", item_path, 200, updated_product)
          check_product(updated, updated_product)

          stored = request("GET", item_path, 200)
          check_product(stored, updated_product)
          assert stored["_id"] == product_id

          # Cập nhật sai không được làm thay đổi dữ liệu.
          invalid_update = dict(updated_product, quantity=1.5)
          request("PUT", item_path, 400, invalid_update)
          check_product(
              request("GET", item_path, 200),
              updated_product
          )

          print("Healthcheck, Create, Read, Update: PASS")
          PY

      - name: Kiem tra du lieu truc tiep trong MongoDB
        run: |
          docker compose exec -T nammongodb \
            mongosh productci_prod_test --quiet --eval '
              const p = db.products.findOne({pid: "CI-PROD-001"});
              if (!p || p.price !== 30000 || p.quantity !== 5) {
                throw new Error("Du lieu MongoDB khong dung");
              }
              print("PASS: Du lieu da luu trong MongoDB");
            '

      - name: Kiem tra du lieu sau khi khoi dong lai API
        run: |
          docker compose restart product-api
          docker compose up -d --wait --wait-timeout 120

          python3 - <<'PY'
          import json
          import urllib.request

          url = "http://127.0.0.1:3000/api/products/CI-PROD-001"
          with urllib.request.urlopen(url, timeout=10) as response:
              assert response.status == 200
              product = json.load(response)

          assert product["price"] == 30000
          assert product["quantity"] == 5
          print("PASS: Du lieu van con sau khi restart API")
          PY

      - name: Kiem tra Delete
        run: |
          API=http://127.0.0.1:3000/api/products/CI-PROD-001

          STATUS=$(curl --max-time 10 -sS -o /dev/null \
            -w "%{http_code}" -X DELETE "$API")
          test "$STATUS" = "204"

          STATUS=$(curl --max-time 10 -sS -o /dev/null \
            -w "%{http_code}" "$API")
          test "$STATUS" = "404"

          docker compose exec -T nammongodb \
            mongosh productci_prod_test --quiet --eval '
              if (db.products.findOne({pid: "CI-PROD-001"}) !== null) {
                throw new Error("San pham chua duoc xoa trong MongoDB");
              }
              print("PASS: Delete");
            '

      - name: Hien trang thai va log khi that bai
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100

      - name: Don dep container
        if: always()
        run: docker compose down --remove-orphans